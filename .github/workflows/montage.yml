name: montage
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      drive_id:
        description: 'ID Drive du clip'
        required: false
      name:
        description: 'Nom'
        required: false
      format:
        description: 'Format'
        default: 'vertical'
      caption:
        description: 'Legende'
        default: 'GTA VI MOOD'
      min_seconds:
        description: 'Duree min'
        default: '0'
      outro:
        description: 'Outro'
        default: '@gtavimood'
concurrency:
  group: montage
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IN_ID: ${{ inputs.drive_id }}
      IN_NAME: ${{ inputs.name }}
      IN_FMT: ${{ inputs.format }}
      IN_CAP: ${{ inputs.caption }}
      IN_MIN: ${{ inputs.min_seconds }}
      IN_OUTRO: ${{ inputs.outro }}
    steps:
      - uses: actions/checkout@v4
      - name: Lancer
        run: |
          if [ -n "$IN_ID" ]; then
            bash make.sh "$IN_ID" "$IN_NAME" "${IN_FMT:-vertical}" "${IN_CAP:-GTA VI MOOD}" "${IN_MIN:-0}" "${IN_OUTRO:-@gtavimood}"
            exit 0
          fi
          tr -d '\r' < queue.txt > q.txt
          ok=0; tries=0
          while IFS='|' read -r id name fmt cap min; do
            [ -z "$id" ] && continue
            if gh release view "$name" >/dev/null 2>&1; then continue; fi
            tries=$((tries+1))
            if bash make.sh "$id" "$name" "$fmt" "$cap" "$min" "@gtavimood"; then ok=$((ok+1)); else echo "echec $name"; fi
            [ "$ok" -ge 3 ] && break
            [ "$tries" -ge 6 ] && break
          done < q.txt
