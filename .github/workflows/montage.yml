name: montage
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      drive_id:
        description: 'ID Drive du clip'
        required: false
      name:
        description: 'Nom'
        required: false
      format:
        description: 'Format'
        default: 'vertical'
      caption:
        description: 'Legende'
        default: 'GTA VI MOOD'
      min_seconds:
        description: 'Duree min'
        default: '0'
      outro:
        description: 'Outro'
        default: '@gtavimood'
concurrency:
  group: montage
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IN_ID: ${{ inputs.drive_id }}
      IN_NAME: ${{ inputs.name }}
      IN_FMT: ${{ inputs.format }}
      IN_CAP: ${{ inputs.caption }}
      IN_MIN: ${{ inputs.min_seconds }}
      IN_OUTRO: ${{ inputs.outro }}
    steps:
      - uses: actions/checkout@v4
      - name: Lancer
        run: |
          if [ -n "$IN_ID" ]; then
            bash make.sh "$IN_ID" "$IN_NAME" "${IN_FMT:-vertical}" "${IN_CAP:-GTA VI MOOD}" "${IN_MIN:-0}" "${IN_OUTRO:-@gtavimood}" < /dev/null
            exit 0
          fi
          pip install --quiet --break-system-packages gdown || pip install --quiet gdown || true
          tr -d '\r' < queue.txt > q.txt
          echo >> q.txt
          python3 - >> q.txt <<'PY' || true
          import gdown, re, sys
          try:
              fs = gdown.download_folder(id='1H1i8bOLUnWDdUmbXv966dndTnZSZXpbA', skip_download=True, quiet=True, use_cookies=False)
              for f in (fs or []):
                  p = f.path
                  low = p.lower()
                  if 'leak' in low or 'savetube' in low or 'videoplayback' in low or not low.endswith('.mp4'):
                      continue
                  n = re.sub(r'[^A-Za-z0-9]', '', p.rsplit('.', 1)[0])
                  print(f'{f.id}|h_{n}|vertical|GTA VI MOOD|0')
          except Exception as e:
              print('liste dossier KO', e, file=sys.stderr)
          PY
          ok=0; tries=0
          while IFS='|' read -r id name fmt cap min <&3; do
            [ -z "$id" ] && continue
            if gh release view "$name" >/dev/null 2>&1; then continue; fi
            tries=$((tries+1))
            if bash make.sh "$id" "$name" "$fmt" "$cap" "$min" "@gtavimood" < /dev/null; then ok=$((ok+1)); else echo "echec $name"; fi
            [ "$ok" -ge 3 ] && break
            [ "$tries" -ge 6 ] && break
          done 3< q.txt
